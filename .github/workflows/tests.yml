name: Tests and installation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.14'
          - os: windows-latest
            python: '3.10'
          - os: windows-latest
            python: '3.14'
          - os: macos-latest
            python: '3.14'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and regression tests
        run: python -m unittest discover -s tests -v
      - name: Browser state regressions
        run: node --test tests/test_frontend_state.js tests/test_research_frontend.js tests/test_changes_frontend.js tests/test_evidence_frontend.js
      - name: Source checkout demo
        run: python demo.py
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir wheelhouse
      - name: Install wheel and run outside checkout
        run: python scripts/verify_install.py --wheel-dir wheelhouse
